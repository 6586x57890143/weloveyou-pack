name: release

# Publishing a channel. `git tag stable-v1.4.2 && git push origin stable-v1.4.2`
# validates it, builds every artifact, and publishes them to GitHub Pages.
#
# Pages rather than R2 for now: no card, no credentials, and packwiz's own docs
# recommend it. The map will be served from the VPS directly, so object storage
# has no remaining job here. Revisit if either outgrows that.
#
# The Discord announcement is deliberately NOT here. wly polls the published
# pack.toml for a version change and posts the release itself, which keeps the
# bot token out of GitHub entirely and means a pack published by hand still
# announces. One code path, not two.
on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish"
        required: true
        type: choice
        options: [stable, edge]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: validate and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796

      - name: resolve channel
        id: ch
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            channel="${{ github.event.inputs.channel }}"
          else
            channel="${GITHUB_REF_NAME%%-v*}"     # stable-v1.4.2 -> stable
          fi
          [ -d "pack/$channel" ] || { echo "::error::no such channel: pack/$channel"; exit 1; }
          version=$(grep -m1 -oE '^version *= *"[^"]+"' "pack/$channel/pack.toml" | grep -oE '"[^"]+"' | tr -d '"')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $channel v$version"

      # Full verification: every file downloaded and hashed before anything
      # reaches a player.
      - name: validate
        run: scripts/pack-check.sh --full

      # Both gates again before publishing: a release must not be able to ship
      # something CI would have rejected on a branch.
      - name: dependency resolution
        run: python scripts/deps-check.py "${{ steps.ch.outputs.channel }}"

      - name: server smoke boot
        run: scripts/smoke-boot.sh "${{ steps.ch.outputs.channel }}"

      - name: build instance zip
        run: python scripts/instance-build.py "${{ steps.ch.outputs.channel }}"

      - name: build mrpack
        working-directory: pack/${{ steps.ch.outputs.channel }}
        run: packwiz modrinth export -o "../../dist/weloveyou-${{ steps.ch.outputs.channel }}.mrpack"

      # Publishing by committing to gh-pages rather than with the Pages artifact
      # actions, because an artifact deploy REPLACES the whole site. That would
      # delete every previously published v{version} prefix, and those are what
      # makes a rollback possible, repointing the rolling prefix at a version
      # that no longer exists is not a rollback.
      # gh-pages is the accumulator, not the thing that serves. Direct Upload
      # replaces the entire deployment every time, so without a durable store of
      # past releases each publish would wipe the pinned v{version} prefixes,
      # and repointing the rolling prefix at a version that no longer exists is
      # not a rollback. This branch keeps them, and doubles as an audit trail of
      # exactly what was served when.
      - name: assemble the site
        id: site
        env:
          CHANNEL: ${{ steps.ch.outputs.channel }}
          VERSION: ${{ steps.ch.outputs.version }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$site"

          dest="$site/pack/${CHANNEL}"
          # Immutable copy first. If the rolling prefix were written first and
          # the run then failed, players would be pointed at a version with no
          # permanent copy to fall back to.
          mkdir -p "$dest/v${VERSION}"
          cp -r "pack/${CHANNEL}/." "$dest/v${VERSION}/"

          # Rolling prefix, rebuilt from scratch so a mod removed from the pack
          # disappears here too. A stale .pw.toml would still resolve for an
          # updater holding an old index. The v* directories are preserved.
          find "$dest" -maxdepth 1 -mindepth 1 ! -name 'v*' -exec rm -rf {} +
          cp -r "pack/${CHANNEL}/." "$dest/"
          rm -rf "$dest/v${VERSION}/v"* 2>/dev/null || true

          cp "dist/weloveyou-${CHANNEL}.zip"    "$dest/weloveyou-${CHANNEL}.zip"
          cp "dist/weloveyou-${CHANNEL}.mrpack" "$dest/weloveyou-${CHANNEL}.mrpack"
          touch "$site/.nojekyll"

          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change to record"
          else
            git commit -q -m "publish ${CHANNEL} v${VERSION}"
            git push -q origin gh-pages
          fi
          echo "dir=$site" >> "$GITHUB_OUTPUT"
          echo "published files: $(find "$site" -type f | wc -l)"

      # Direct Upload rather than Cloudflare's Git integration: this way
      # Cloudflare is never granted read access to the repository. The trade is
      # one scoped API token living in GitHub secrets, which is the same shape
      # as every other credential here.
      #
      # wrangler is pinned. It is a build-time dependency with a deploy token in
      # its environment, so it does not float on @latest.
      - name: deploy to cloudflare pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"  || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          project="${PROJECT:-weloveyou-pack}"

          # Idempotent: succeeds when the project already exists.
          npx --yes wrangler@4 pages project create "$project" \
            --production-branch=gh-pages 2>/dev/null || true

          npx --yes wrangler@4 pages deploy "${{ steps.site.outputs.dir }}" \
            --project-name="$project" \
            --branch=gh-pages \
            --commit-dirty=true

      - name: summary
        env:
          CHANNEL: ${{ steps.ch.outputs.channel }}
          VERSION: ${{ steps.ch.outputs.version }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          base="https://${PROJECT:-weloveyou-pack}.pages.dev"
          {
            echo "### ${CHANNEL} v${VERSION} published"
            echo
            echo "- rolling: \`${base}/pack/${CHANNEL}/pack.toml\`"
            echo "- pinned:  \`${base}/pack/${CHANNEL}/v${VERSION}/pack.toml\`"
            echo "- instance zip: \`${base}/pack/${CHANNEL}/weloveyou-${CHANNEL}.zip\`"
            echo
            echo "wly will notice the version change and post the release to Discord."
          } >> "$GITHUB_STEP_SUMMARY"
