name: ci

# Every push and pull request. Two invariants live here:
#   - every mod entry declares an explicit `side`
#   - mmc-pack.json and pack.toml agree on Minecraft and Fabric versions
# Neither may gain `continue-on-error`.
on:
  push:
    # gh-pages is generated output, not source: it has no pack/ to validate and
    # CI fails on it every publish. Exclude it rather than teach the checks to
    # tolerate a branch they were never meant to see.
    branches: ["**", "!gh-pages"]
    tags-ignore: ["*-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: pack invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      # packwiz publishes no tags, so this is an exact pseudo-version pin rather
      # than @latest. Bump it deliberately, never implicitly, this binary
      # decides what every player downloads.
      - name: install packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796
      # Structure and reachability only. --full downloads hundreds of megabytes
      # and belongs in the release path, not on every PR.
      - run: scripts/pack-check.sh

  # What mods DECLARE. Catches a wrong `side` on either side of the wire, which
  # pack-check.sh structurally cannot: it proves a side is declared, never that
  # it is correct. Two of the three side bugs that reached players broke the
  # client, which cannot be booted headlessly, so this is the only check that
  # sees them.
  deps:
    name: dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/deps-check.py

  # What mods DO. Spark's async-profiler segfaulted the JVM with a perfectly
  # valid dependency graph; only starting a server finds that.
  smoke:
    name: server smoke boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      - name: install packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796
      - run: scripts/smoke-boot.sh stable

  instance:
    name: instance zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Verifies the pinned packwiz-installer.jar hash and the version agreement
      # between mmc-pack.json and pack.toml before it will build anything.
      - run: python scripts/instance-build.py
      # Render the endpoint page on every PR. --offline skips Modrinth, so this
      # is a syntax and template check rather than a network test. The platform
      # repo learned this the expensive way: nothing ran its site generator
      # until the publish did, so a crash in it surfaced as a red deploy after
      # the merge that was meant to publish.
      - run: python scripts/pack-site.py stable --offline --out "$RUNNER_TEMP/site"
      - run: python scripts/pack-site.py --root "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: instance-zips
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
