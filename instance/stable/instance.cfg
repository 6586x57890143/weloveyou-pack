# Prism Launcher instance, weloveyou (stable)
#
# CI substitutes @PACK_URL@ when it builds the zip, so this file is a template
# and the URL lives in exactly one place: channels.toml.
#
# The pre-launch command is the whole mechanism. Prism runs it before every
# launch, and packwiz-installer brings .minecraft in line with the published
# pack: downloads what changed, deletes what was removed. That is why a pack
# release normally asks nothing of the player.
#
# It invokes Main directly rather than `java -jar`. The jar's Main-Class is
# RequiresBootstrap, which exists only to refuse and tell you to use
# packwiz-installer-bootstrap. We deliberately do not use the bootstrap: it
# downloads and executes a jar from GitHub on every launch, and its own last
# release was July 2020. The jar here is pinned and hash-checked in CI instead.

InstanceType=OneSix
name=weloveyou
iconKey=default

OverrideCommands=true
PreLaunchCommand="$INST_JAVA" -cp "$INST_MC_DIR/packwiz-installer.jar" link.infra.packwiz.installer.Main -s client "@PACK_URL@"

# 4G suits a machine with 8G total, which is the floor we support. Players with
# more should raise MaxMemAlloc; the pack does not need more than 6G even with
# shaders, and giving the JVM more than it uses makes GC pauses worse, not better.
OverrideMemory=true
MinMemAlloc=2048
MaxMemAlloc=4096

# Left deliberately unset: OverrideJavaLocation and OverrideJavaArgs. Prism
# picks a correct JRE for 1.21.1 on its own, and pinning a path here would break
# on every machine that isn't the one it was written on.
