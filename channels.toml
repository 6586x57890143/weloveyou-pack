# Where each channel is published. The instance builder substitutes pack_url
# into instance.cfg, so this is the single place a channel's URL is written on
# the pack side.
#
# Cloudflare Pages, deployed by Direct Upload from the release workflow. The
# repository stays private and Cloudflare is never granted access to it; the
# gh-pages branch is the accumulator that keeps past releases, and wrangler
# uploads it. Swapping to a custom domain later is a change to this line plus a
# re-tag.
#
# The platform repo (weloveyou.mc) carries the same URL in wly.toml, because the
# daemon polls it to detect releases. One URL, duplicated once, deliberately.
# The alternative is a shared config repo, which is more machinery than a URL is
# worth.

[stable]
pack_url = "https://weloveyou-pack.pages.dev/pack/stable/pack.toml"

